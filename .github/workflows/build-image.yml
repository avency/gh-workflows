name: Build Docker Image

on:
  workflow_call:
    inputs:
      docker-registry:
        type: string
        required: true
      docker-image-owner:
        type: string
        required: true
      docker-image-name:
        type: string
        required: true
      image-is-latest:
        type: boolean
        required: false
        default: false
      build-context:
        type: string
        required: false
        default: .
      build-dockerfile:
        type: string
        required: false
        default: Dockerfile
      vulnerability-scan-run:
        type: boolean
        default: true
      vulnerability-scan-threshold:
        type: string
        default: CRITICAL
    secrets:
      REGISTRY_USERNAME:
        required: true
        description: "Docker registry username"
      REGISTRY_PASSWORD:
        required: true
        description: "Docker registry password"
      BUILD_SECRETS:
        required: false
        description: "Build secrets to be used during build"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into github registry ${{ inputs.docker-registry }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ inputs.docker-registry }}/${{ inputs.docker-image-owner }}/${{ inputs.docker-image-name }}
          flavor: |
            latest=${{ inputs.image-is-latest }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-

      - name: Build Docker Image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.build-dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: ${{ secrets.BUILD_SECRETS }}

      - name: Scan for vulnerabilities
        if: ${{ inputs.vulnerability-scan-run }}
        uses: crazy-max/ghaction-container-scan@v4
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          dockerfile: ${{ inputs.build-context }}/${{ inputs.build-dockerfile }}
          annotations: true
          severity_threshold: ${{ inputs.vulnerability-scan-threshold }}
        env:
          TRIVY_TIMEOUT: 10m
          TRIVY_SCANNERS: 'vuln'

      - name: Push Docker Image to Docker Hub
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.build-dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: false
          provenance: false
